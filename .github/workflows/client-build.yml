name: client-build-and-release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # --- Linux ---
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 7
          # --- Windows ---
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          # --- macOS ---
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      # Full releases (tags without a pre-release suffix, e.g. v1.2.3) must be
      # cut from a commit that is already on main. Pre-releases (e.g.
      # v1.2.3-rc.1) may be built from any branch.
      - name: Checkout with full history
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check tagged commit is on main (full releases only)
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        run: |
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            exit 0
          else
            echo "Tag ${{ github.ref_name }} is a full release but its commit is not on main." >&2
            exit 1
          fi

      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        id: setup-go
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        shell: bash
        if: ${{ steps.setup-go.outputs.cache-hit != 'true' }}
        run: go mod download

      - name: Build the project
        run: |
          if [ "${{ matrix.goarch }}" = "arm" ]; then
           export GOARM=${{ matrix.goarm }}
           OUTFILE=inonius_v3cli-${{ matrix.goos }}-${{ matrix.goarch }}v${{ matrix.goarm }}
          else
           OUTFILE=inonius_v3cli-${{ matrix.goos }}-${{ matrix.goarch }}
          fi
          if [ "${{ matrix.goos }}" == "windows" ]; then
           GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} GOARM=${GOARM:-} go build -o ${OUTFILE}.exe
          else
           GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} GOARM=${GOARM:-} go build -o ${OUTFILE}
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inonius_v3cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarch == 'arm' && format('v{0}', matrix.goarm) || '' }}
          path: |
            inonius_v3cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarch == 'arm' && format('v{0}', matrix.goarm) || '' }}
            inonius_v3cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarch == 'arm' && format('v{0}', matrix.goarm) || '' }}.exe

      #      - name: Bump version and push tag
      #        id: bump
      #        uses: anothrNick/github-tag-action@v1
      #        env:
      #          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #          WITH_V: false
      #          DEFAULT_BUMP: patch

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/**
